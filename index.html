<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Helix Workspace — Design Engineering Case Study</title>
    <meta
      name="description"
      content="An original case study: designing and building a scientific data-analysis workspace with a token-based design system, interactive visualization, and accessible interaction patterns."
    />
    <meta property="og:title" content="Helix Workspace — Design Engineering Case Study" />
    <meta property="og:description" content="Designing clarity into complex scientific workflows. React, TypeScript, Tailwind, D3." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#f6f6f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0b0d" media="(prefers-color-scheme: dark)" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      ;(function () {
        var pref = 'system'
        try {
          pref = localStorage.getItem('helix-theme') || 'system'
        } catch (e) {}
        var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
